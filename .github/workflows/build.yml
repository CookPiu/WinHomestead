name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 目标框架是 net48，runner 自带它的 targeting pack；这里装的 SDK 只用来跑构建本身
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Debug 构建 + 单元测试
        shell: pwsh
        run: .\build\build.ps1

      - name: Release 单 exe
        shell: pwsh
        run: .\build\publish.ps1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WinHomestead-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
